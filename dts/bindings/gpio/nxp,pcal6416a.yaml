description: PCAL6416A 16-bit I2C-based I/O expander

compatible: "nxp,pcal6416a"

include: nxp,pcal64xxa-base.yaml

properties:
  ngpios:
    required: true
    const: 16
  index:
    type: int
    description: |
      Logical bank index used by ecfw-zephyr middle layer
      (mdl_gpio_hub) to pack (port, pin) into uint32_t. Optional.
