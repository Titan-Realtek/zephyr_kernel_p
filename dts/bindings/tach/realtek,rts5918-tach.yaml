description: Realtek rts5918 tachometer controller

compatible: "realtek,rts5918-tach"

include: [tach.yaml, pinctrl-device.yaml, sensor-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: false

  pinctrl-names:
    required: false

  pulses-per-round:
    type: int
    required: false
    description: number of pulses per round of tachometer's input
