description: Realtek RTS5918 I3C controller/target

compatible: "realtek,rts5918-i3c"

include: [i3c-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true
    description: SCCON gate for the I3C IP clock.

  clock-frequency:
    type: int
    description: |
      I3C IP functional clock frequency in Hz (125 MHz - 400 MHz). Used to
      derive SCL divider and bus timing register values at runtime.

  i3c-od-scl-hz:
    type: int
    description: I3C open-drain SCL frequency in Hz.

  target-mode:
    type: boolean
    description: Configure this I3C instance as a target instead of a primary controller.

  static-addr:
    type: int
    description: Static address used when target-mode is enabled.

  primary-controller-da:
    type: int
    description: Preferred dynamic address for the primary controller.

  pid-msb:
    type: int
    description: Upper 16 bits of the 48-bit target provisioned ID.

  pid-lsb:
    type: int
    description: Lower 32 bits of the 48-bit target provisioned ID.

  bcr:
    type: int
    description: Target Bus Characteristics Register value.

  dcr:
    type: int
    description: Target Device Characteristics Register value.

  max-read-len:
    type: int
    description: Target maximum read length.

  max-write-len:
    type: int
    description: Target maximum write length.
