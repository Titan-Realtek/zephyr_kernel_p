# rts5918_evb tuning for the MCTP-over-I3C endpoint sample.
#
# The bus owner pings at 1 Hz; a pong is sent back only after the owner
# reads it (triggered by the target's IBI). When that read lags the ping
# cadence, pong pktbufs queue in libmctp and the default 2 KB MCTP heap
# runs out ("Could not allocate pktbuf"). Give it headroom.
CONFIG_MCTP_HEAP_SIZE=8192

# MCTP_I3C_TARGET depends on I3C_TARGET_BUFFER_MODE; set it here so the
# target sample is self-sufficient rather than relying on a board default.
CONFIG_I3C_TARGET_BUFFER_MODE=y
