# rts5918_evb: enable the RTK I3C vendor core log for bring-up/validation.
#
# Keep the level at 3. Level 4 turns on the LOG_DBG prints in the I3C hot
# path (ISR / ibi_write / done_isr); the added latency blows the tight
# IBI-MDB timing window, so the target misses it and the MDB never reaches
# the bus. Use the logic analyzer, not level 4, to inspect IBI timing.
CONFIG_RTK_I3C_CORE_LOG=y
CONFIG_RTK_I3C_CORE_LOG_LEVEL=3
